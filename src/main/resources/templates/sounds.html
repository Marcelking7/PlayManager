<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Sons</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- CSRF meta for JS usage -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <nav class="sidebar-nav">
            <a href="#" class="nav-item" data-tooltip="Accueil" th:href="@{/}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
            </a>
            <a href="#" class="nav-item" data-tooltip="Sons" th:href="@{/sounds}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
            </a>
        </nav>
    </aside>
    <div th:if="${flashMessage}" class="flash-notification" th:classappend="${flashType ?: 'info'}">
        <span th:text="${flashMessage}"></span>
        <button onclick="this.parentElement.style.display='none'">×</button>
    </div>
    <header class="app-header">
        <div class="header-content">
            <button class="sidebar-toggle" onclick="toggleSidebar()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
                <h1>Gestion des Sons</h1>
            </div>
            <button class="btn btn-primary" onclick="toggleModal('uploadSoundModal')">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                Upload Son
            </button>
        </div>
    </header>

    <main class="main-content">
        <div class="content-wrapper">
            <div th:if="${sounds.empty}" class="empty-state">
                <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
                <h2>Aucun son</h2>
                <p>Uploadez votre premier son</p>
                <button class="btn btn-primary" onclick="toggleModal('uploadSoundModal')">Upload Son</button>
            </div>

            <div th:unless="${sounds.empty}" class="sounds-list">
                <article class="sound-card" th:each="sound : ${sounds}">
                    <div class="sound-info">
                        <h3 th:text="${sound.originalFilename}">Filename</h3>
                        <p th:text="${sound.eventType}">Event Type</p>
                        <p th:text="${#numbers.formatDecimal(sound.size / 1024, 1, 2)} + ' KB'">Size</p>
                    </div>
                    <audio controls>
                        <source th:src="@{/sounds/{filename}(filename=${sound.filename})}" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                    <button class="btn-icon-only btn-delete" th:onclick="|deleteSound(${sound.id})|" aria-label="Supprimer">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                    </button>
                </article>
            </div>
        </div>
    </main>

    <div id="uploadSoundModal" class="modal">
        <div class="modal-overlay" onclick="toggleModal('uploadSoundModal')"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Uploader un son</h2>
                <button class="modal-close" onclick="toggleModal('uploadSoundModal')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <form th:action="@{/sounds/upload}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-group">
                    <label for="file">Fichier audio</label>
                    <input type="file" id="file" name="file" accept="audio/*" required>
                </div>
                <div class="form-group">
                    <label for="eventType">Type d'événement</label>
                    <select id="eventType" name="eventType" required>
                        <option value="reminder">Rappel</option>
                        <option value="notification">Notification</option>
                        <option value="alert">Alerte</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="toggleModal('uploadSoundModal')">Annuler</button>
                    <button type="submit" class="btn btn-primary">Uploader</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
<script>
function deleteSound(id) {
    if (confirm("Êtes-vous sûr de vouloir supprimer ce son ?")) {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = `/sounds/${id}/delete`;
        // Append CSRF hidden input
        if (typeof appendCsrfInput === 'function') {
            appendCsrfInput(form);
        }
        document.body.appendChild(form);
        form.submit();
    }
}
</script>
</body>
</html>
