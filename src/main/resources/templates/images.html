<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Images</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- CSRF meta for JS usage -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <nav class="sidebar-nav">
            <a href="#" class="nav-item" data-tooltip="Accueil" th:href="@{/}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
            </a>
            <a href="#" class="nav-item" data-tooltip="Images" th:href="@{/images}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="9" cy="9" r="2"/>
                    <path d="m21 15-3.086-3.086a2 2 0 00-2.828 0L6 21"/>
                </svg>
            </a>
        </nav>
    </aside>
    <div th:if="${flashMessage}" class="flash-notification" th:classappend="${flashType ?: 'info'}">
        <span th:text="${flashMessage}"></span>
        <button onclick="this.parentElement.style.display='none'">×</button>
    </div>
    <header class="app-header">
        <div class="header-content">
            <button class="sidebar-toggle" onclick="toggleSidebar()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="9" cy="9" r="2"/>
                    <path d="m21 15-3.086-3.086a2 2 0 00-2.828 0L6 21"/>
                </svg>
                <h1>Gestion des Images</h1>
            </div>
            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                Upload Image
            </button>
        </div>
    </header>

    <main class="main-content">
        <div class="content-wrapper">
            <div th:if="${images.empty}" class="empty-state">
                <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="9" cy="9" r="2"/>
                    <path d="m21 15-3.086-3.086a2 2 0 00-2.828 0L6 21"/>
                </svg>
                <h2>Aucune image</h2>
                <p>Uploadez votre première image</p>
            </div>

            <div th:unless="${images.empty}" class="images-grid">
                <article class="image-card" th:each="image : ${images}">
                    <img th:src="@{/images/{filename}(filename=${image.filename})}" alt="Image" />
                    <div class="image-info">
                        <h3 th:text="${image.originalFilename}">Filename</h3>
                        <p th:text="${#numbers.formatDecimal(image.size / 1024, 1, 2)} + ' KB'">Size</p>
                    </div>
                    <button class="btn-icon-only btn-delete" th:onclick="|deleteImage(${image.id})|" aria-label="Supprimer">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                    </button>
                </article>
            </div>
        </div>
    </main>

    <form id="uploadForm" th:action="@{/images/upload}" method="post" enctype="multipart/form-data" style="display: none;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="file" id="fileInput" name="file" accept="image/*" onchange="document.getElementById('uploadForm').submit()">
    </form>
</div>

<script th:src="@{/js/main.js}"></script>
<script>
function deleteImage(id) {
    if (confirm("Êtes-vous sûr de vouloir supprimer cette image ?")) {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = `/images/${id}/delete`;
        // Append CSRF hidden input
        if (typeof appendCsrfInput === 'function') {
            appendCsrfInput(form);
        }
        document.body.appendChild(form);
        form.submit();
    }
}
</script>
</body>
</html>
