<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Événements</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- CSRF meta for JS usage -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <nav class="sidebar-nav">
            <a href="#" class="nav-item" data-tooltip="Accueil" th:href="@{/}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
            </a>
            <a href="#" class="nav-item" data-tooltip="Événements" th:href="@{/events}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
            </a>
        </nav>
    </aside>
    <div th:if="${flashMessage}" class="flash-notification" th:classappend="${flashType ?: 'info'}">
        <span th:text="${flashMessage}"></span>
        <button onclick="this.parentElement.style.display='none'">×</button>
    </div>
    <header class="app-header">
        <div class="header-content">
            <button class="sidebar-toggle" onclick="toggleSidebar()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <h1>Gestion des Événements</h1>
            </div>
            <button class="btn btn-primary" onclick="toggleModal('addEventModal')">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                Nouvel Événement
            </button>
        </div>
    </header>

    <main class="main-content">
        <div class="content-wrapper">
            <div th:if="${events.empty}" class="empty-state">
                <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <h2>Aucun événement</h2>
                <p>Planifiez votre premier événement</p>
                <button class="btn btn-primary" onclick="toggleModal('addEventModal')">Créer un événement</button>
            </div>

            <div th:unless="${events.empty}" class="events-grid">
                <article class="event-card" th:each="event : ${events}">
                    <div class="event-header">
                        <h3 th:text="${event.title}">Titre</h3>
                        <span class="event-date" th:text="${#temporals.format(event.eventDate, 'dd/MM/yyyy HH:mm')}">Date</span>
                    </div>
                    <p th:text="${event.description}">Description</p>
                    <div class="event-actions">
                        <button class="btn-icon-only" th:onclick="|deleteEvent(${event.id})|" aria-label="Supprimer">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </button>
                    </div>
                </article>
            </div>
        </div>
    </main>

    <div id="addEventModal" class="modal">
        <div class="modal-overlay" onclick="toggleModal('addEventModal')"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Ajouter un événement</h2>
                <button class="modal-close" onclick="toggleModal('addEventModal')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <form th:action="@{/events/add}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-group">
                    <label for="title">Titre</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description"></textarea>
                </div>
                <div class="form-group">
                    <label for="eventDate">Date de l'événement</label>
                    <input type="datetime-local" id="eventDate" name="eventDate" required>
                </div>
                <div class="form-group">
                    <label for="reminderDate">Date du rappel</label>
                    <input type="datetime-local" id="reminderDate" name="reminderDate">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="toggleModal('addEventModal')">Annuler</button>
                    <button type="submit" class="btn btn-primary">Ajouter</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
<script>
function deleteEvent(id) {
    if (confirm("Êtes-vous sûr de vouloir supprimer cet événement ?")) {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = `/events/${id}/delete`;
        // Append CSRF hidden input
        if (typeof appendCsrfInput === 'function') {
            appendCsrfInput(form);
        }
        document.body.appendChild(form);
        form.submit();
    }
}
</script>
</body>
</html>
